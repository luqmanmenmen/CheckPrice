name: Retail Sync Engine (3 Kategori Python Turbo Engine — 100% Turso Cloud)

# ARSITEKTUR MURNI PYTHON DI GITHUB ACTIONS + TURSO CLOUD (0% SUPABASE!)
# Cron otomatis tetap dimatikan agar quota menit GitHub (2.000 menit/bulan) hemat.
# Seluruh eksekusi dipicu instan dari Frontend UI (/super-admin/sinkronisasi-harian) atau Webhook Email Promo.

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Pilih kategori mesin Python yang dijalankan'
        required: true
        default: 'all'
        type: choice
        options:
          - scrab
          - mds-bisa
          - muku-scrab
          - muku-stock
          - photos
          - stock-only
          - suko-sales
          - promo
          - upcoming-promo
          - catalog
          - analytics
          - all
      promo_url:
        description: 'URL/Path file promo di Turso Storage (opsional, jika kosong akan ambil folder terbaru PROMO/)'
        required: false
        default: ''
        type: string
      force:
        description: 'Paksa sinkronisasi (force bypass)'
        required: false
        default: false
        type: boolean
      session_cookie:
        description: 'Session Cookie (opsional, jika kosong otomatis ambil dari Turso Storage / Auto-Login)'
        required: false
        default: ''
        type: string
      sales_date:
        description: 'Tanggal buku sales YYYY-MM-DD (opsional, mis. susulan kemarin jika lupa tarik sales)'
        required: false
        default: ''
        type: string

  repository_dispatch:
    types: [trigger-sync-engine, trigger-scrab, trigger-mds-bisa, trigger-muku-scrab, trigger-muku-stock, trigger-stock-only, trigger-suko-sales, trigger-photos, trigger-promo, trigger-upcoming-promo, trigger-catalog, trigger-analytics]

concurrency:
  group: retail-sync-group
  cancel-in-progress: false

jobs:
  sync:
    name: Run Python Retail Engine (100% Turso Cloud)
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: 📥 Checkout Repository & Brankas Mapping 84.763 SKU
        uses: actions/checkout@v4

      - name: 🐍 Setup Python Turbo Environment (v3.11)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'python-engine/requirements.txt'

      - name: 📦 Install Python Engine Dependencies
        run: |
          pip install -r python-engine/requirements.txt

      - name: 🛡️ [INIT] Inisialisasi Guardian Live Console & Baseline DB Turso
        run: |
          python -u python-engine/runner_guardian.py --init-run --action "${{ github.event.inputs.action || github.event.action || 'all' }}"
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}

      - name: 🔥 [KATEGORI 1A - SCRAB BY LUQMAN ORG] Brutal Scraper by luqman org (Turbo Workers • SKU & Barcode Sweep)
        if: ${{ github.event.inputs.action == 'scrab' || github.event.inputs.action == 'mds-bisa' || github.event.inputs.action == 'all' || github.event.action == 'trigger-scrab' || github.event.action == 'trigger-mds-bisa' || github.event.action == 'trigger-sync-engine' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == '') }}
        run: |
          python -u python-engine/runner_guardian.py --step "KATEGORI 1A - Brutal Scrab SUKO (Luqman Arif)" --action "${{ github.event.inputs.action || github.event.action || 'all' }}" --max-retries 3 --track-new-products -- python python-engine/morning_full_sweep.py --account=suko --brutal --upc-first --workers=24 --minutes=18 --no-catalog --no-inline-images
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          MDS_SESSION_COOKIE: ${{ github.event.inputs.session_cookie || secrets.MDS_SESSION_COOKIE }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}

      - name: 🏷️ [KATEGORI 1D - SCRAB KHUSUS MU+KU] Brutal Scraper & Barcode Recovery Akun Mu+Ku
        if: ${{ github.event.inputs.action == 'muku-scrab' || github.event.inputs.action == 'scrab' || github.event.inputs.action == 'mds-bisa' || github.event.inputs.action == 'all' || github.event.action == 'trigger-muku-scrab' || github.event.action == 'trigger-scrab' || github.event.action == 'trigger-mds-bisa' || github.event.action == 'trigger-sync-engine' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == '') }}
        run: |
          MUKU_MIN=24
          if [ "${{ github.event.inputs.action }}" = "muku-scrab" ] || [ "${{ github.event.action }}" = "trigger-muku-scrab" ]; then
            MUKU_MIN=35
          fi
          python -u python-engine/runner_guardian.py --step "KATEGORI 1D - Scrab Produk Mu+Ku (Aurel)" --action "${{ github.event.inputs.action || github.event.action || 'muku-scrab' }}" --max-retries 3 --track-new-products -- python python-engine/morning_full_sweep.py --account=muku --brutal --upc-first --workers=24 --minutes=$MUKU_MIN --no-catalog --no-inline-images
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          MDS_MUKU_SESSION_COOKIE: ${{ secrets.MDS_MUKU_SESSION_COOKIE }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}

      - name: 📦 [KATEGORI 1B - EKSPANSI & AUDIT ARTIKEL BARU] Collect & Tambah Artikel/SKU Belum Ada (SUKO, Mu+Ku, ZES)
        if: ${{ github.event.inputs.action == 'scrab' || github.event.inputs.action == 'all' || github.event.action == 'trigger-scrab' || github.event.action == 'trigger-sync-engine' }}
        run: |
          if [ -n "$TURSO_DATABASE_URL" ]; then
            python -u python-engine/runner_guardian.py --step "KATEGORI 1B (Collector): Ekspansi Vendor & Audit" --action "${{ github.event.inputs.action || github.event.action || 'all' }}" --max-retries 3 --track-new-products -- python python-engine/raw_vault_collector.py --collect-vendors --collect-web --audit
            python -u python-engine/runner_guardian.py --step "KATEGORI 1B (Expander): Katalog luqman org" --action "${{ github.event.inputs.action || github.event.action || 'all' }}" --max-retries 3 --track-new-products -- python python-engine/matahari_catalog_expander.py
          else
            echo "TURSO_DATABASE_URL belum dikonfigurasi, lewati ekspansi artikel online."
          fi
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          MDS_SESSION_COOKIE: ${{ github.event.inputs.session_cookie || secrets.MDS_SESSION_COOKIE }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}

      - name: 📸 [KATEGORI 1C - SCRAB GAMBAR & HEAL 404] Brutal Image Scraper + Pemulih URL Foto
        if: ${{ github.event.inputs.action == 'scrab' || github.event.inputs.action == 'muku-scrab' || github.event.inputs.action == 'photos' || github.event.inputs.action == 'all' || github.event.action == 'trigger-scrab' || github.event.action == 'trigger-muku-scrab' || github.event.action == 'trigger-photos' || github.event.action == 'trigger-sync-engine' }}
        run: |
          python -u python-engine/runner_guardian.py --step "KATEGORI 1C: Brutal Image Scraper" --action "${{ github.event.inputs.action || github.event.action || 'all' }}" --max-retries 3 -- python python-engine/brutal_image_scraper.py
          if [ -n "$TURSO_DATABASE_URL" ]; then
            python -u python-engine/runner_guardian.py --step "KATEGORI 1C: Pemulih URL Foto 404" --action "${{ github.event.inputs.action || github.event.action || 'all' }}" --max-retries 1 -- python python-engine/repair_broken_images.py --scan-limit 350 --workers 32 || true
          fi
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}

      - name: ⚡ [KATEGORI 2 - UPDATE STOCK & SALES SUKO] Update Stok Terkini & Rekap Penjualan luqman org
        if: ${{ github.event.inputs.action == 'stock-only' || github.event.inputs.action == 'suko-sales' || github.event.inputs.action == 'all' || github.event.action == 'trigger-stock-only' || github.event.action == 'trigger-suko-sales' }}
        run: |
          SALES_DATE="${{ github.event.inputs.sales_date }}"
          SALES_DATE_FLAG=""
          if [ -n "$SALES_DATE" ]; then
            SALES_DATE_FLAG="--sales-date=$SALES_DATE"
          fi
          if [ "${{ github.event.inputs.action }}" = "suko-sales" ] || [ "${{ github.event.action }}" = "trigger-suko-sales" ]; then
            python -u python-engine/runner_guardian.py --step "KATEGORI 2: Tarik Sales & Stok SUKO Cepat" --action "suko-sales" --max-retries 3 -- python python-engine/morning_full_sweep.py --account=suko --suko-sales-only --minutes=20 $SALES_DATE_FLAG
          else
            python -u python-engine/runner_guardian.py --step "KATEGORI 2: Update Stock Live Mapping & Sales SUKO" --action "${{ github.event.inputs.action || github.event.action || 'all' }}" --max-retries 3 -- python python-engine/morning_full_sweep.py --account=suko --stock-only --minutes=15 $SALES_DATE_FLAG
          fi
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          MDS_SESSION_COOKIE: ${{ github.event.inputs.session_cookie || secrets.MDS_SESSION_COOKIE }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}

      - name: ⚡ [KATEGORI 2B - UPDATE STOCK MU+KU] Update Stok Live Khusus Produk Mu+Ku
        if: ${{ github.event.inputs.action == 'muku-stock' || github.event.inputs.action == 'stock-only' || github.event.inputs.action == 'all' || github.event.action == 'trigger-muku-stock' || github.event.action == 'trigger-stock-only' || github.event.action == 'trigger-sync-engine' }}
        run: |
          MUKU_STK_MIN=22
          if [ "${{ github.event.inputs.action }}" = "muku-stock" ] || [ "${{ github.event.action }}" = "trigger-muku-stock" ]; then
            MUKU_STK_MIN=35
          fi
          python -u python-engine/runner_guardian.py --step "KATEGORI 2B: Update Stock Live Mu+Ku (Aurel)" --action "${{ github.event.inputs.action || github.event.action || 'muku-stock' }}" --max-retries 3 -- python python-engine/morning_full_sweep.py --account=muku --stock-only --minutes=$MUKU_STK_MIN
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          MDS_MUKU_SESSION_COOKIE: ${{ secrets.MDS_MUKU_SESSION_COOKIE }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}

      - name: 🏷️ [KATEGORI 3 - UPDATE PROMO EMAIL] Python Promo Parser Engine (Turso Storage PROMO/ + Gemini AI)
        if: ${{ github.event.inputs.action == 'promo' || github.event.inputs.action == 'all' || github.event.action == 'trigger-promo' || github.event.action == 'trigger-sync-engine' }}
        run: |
          PROMO_URL="${{ github.event.inputs.promo_url }}"
          if [ -n "$PROMO_URL" ]; then
            python -u python-engine/runner_guardian.py --step "KATEGORI 3: Update Promo Email Engine" --action "${{ github.event.inputs.action || github.event.action || 'all' }}" --max-retries 3 -- python python-engine/run_promo_sync.py "--file=$PROMO_URL"
          else
            python -u python-engine/runner_guardian.py --step "KATEGORI 3: Update Promo Email Engine" --action "${{ github.event.inputs.action || github.event.action || 'all' }}" --max-retries 3 -- python python-engine/run_promo_sync.py
          fi
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}

      - name: 🏷️ [KATEGORI 6 - PERSIAPAN POP H-2/H-1] Compile Draft upcoming-promo.json (Read-Only DB Berjalan)
        if: ${{ github.event.inputs.action == 'upcoming-promo' || github.event.inputs.action == 'trigger-upcoming-promo' }}
        run: |
          PROMO_URL="${{ github.event.inputs.promo_url }}"
          if [ -n "$PROMO_URL" ]; then
            python -u python-engine/runner_guardian.py --step "KATEGORI 6: Persiapan POP H-2/H-1" --action "${{ github.event.inputs.action || github.event.action || 'all' }}" --max-retries 3 -- python python-engine/run_promo_sync.py --upcoming "--file=$PROMO_URL"
          else
            python -u python-engine/runner_guardian.py --step "KATEGORI 6: Persiapan POP H-2/H-1" --action "${{ github.event.inputs.action || github.event.action || 'all' }}" --max-retries 3 -- python python-engine/run_promo_sync.py --upcoming
          fi
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}

      - name: 🧠 [KATEGORI 4 - CATALOG BRAIN & OFFLINE SNAPSHOT] Susun CatalogArticle + Kompilasi DB Offline .json.gz
        if: ${{ (success() && github.event.inputs.action != 'analytics' && github.event.inputs.action != 'trigger-analytics' && github.event.inputs.action != 'upcoming-promo' && github.event.inputs.action != 'trigger-upcoming-promo' && github.event.inputs.action != 'suko-sales' && github.event.action != 'trigger-suko-sales') || github.event.inputs.action == 'catalog' || github.event.action == 'trigger-catalog' }}
        run: |
          if [ -n "$TURSO_DATABASE_URL" ]; then
            STOCK_ONLY_FLAG=""
            if [ "${{ github.event.inputs.action }}" = "stock-only" ] || [ "${{ github.event.action }}" = "trigger-stock-only" ] || [ "${{ github.event.inputs.action }}" = "muku-stock" ] || [ "${{ github.event.action }}" = "trigger-muku-stock" ]; then
              STOCK_ONLY_FLAG="--stock-only"
            fi
            python -u python-engine/runner_guardian.py --step "KATEGORI 4: Catalog Brain & Offline Snapshot" --action "${{ github.event.inputs.action || github.event.action || 'all' }}" --max-retries 3 -- python python-engine/build_catalog_index.py $STOCK_ONLY_FLAG
          else
            echo "TURSO_DATABASE_URL belum dikonfigurasi di GitHub Secrets, lewati rebuild CatalogArticle."
          fi
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}

      - name: 📊 [KATEGORI 5 - ADMIN ANALYTICS & CLEANUP] Clean Promo, Generate PO, & Precompute JSON Turso
        if: ${{ github.event.inputs.action == 'analytics' || github.event.inputs.action == 'promo' || github.event.inputs.action == 'stock-only' || github.event.inputs.action == 'catalog' || github.event.inputs.action == 'all' || github.event.action == 'trigger-analytics' || github.event.action == 'trigger-promo' || github.event.action == 'trigger-sync-engine' }}
        run: |
          if [ -n "$TURSO_DATABASE_URL" ]; then
            python -u python-engine/runner_guardian.py --step "KATEGORI 5: Admin Analytics & Cleanup" --action "${{ github.event.inputs.action || github.event.action || 'all' }}" --max-retries 3 -- python python-engine/run_admin_analytics.py --clean-promo --generate-po --analytics
          else
            echo "TURSO_DATABASE_URL belum dikonfigurasi, lewati admin analytics precompute."
          fi
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
