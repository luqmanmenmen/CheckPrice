name: Retail Sync Engine (3 Kategori Python Turbo Engine)

# ARSITEKTUR MURNI PYTHON DI GITHUB ACTIONS (BUKAN DI VERCEL!)
# Cron otomatis tetap dimatikan agar quota menit GitHub (2.000 menit/bulan) hemat.
# Seluruh eksekusi dipicu instan dari Frontend UI (/super-admin/sinkronisasi-harian) atau Webhook Email Promo.

on:
  # schedule:
  #   - cron: '45 2 * * *'
  #   - cron: '0 14 * * *'

  workflow_dispatch:
    inputs:
      action:
        description: 'Pilih kategori mesin Python yang dijalankan'
        required: true
        default: 'all'
        type: choice
        options:
          - scrab
          - mds-bisa
          - photos
          - stock-only
          - promo
          - all
      promo_url:
        description: 'URL file promo (opsional, jika kosong akan ambil semua file di folder terbaru Storage PROMO/)'
        required: false
        default: ''
        type: string
      force:
        description: 'Paksa sinkronisasi (force bypass)'
        required: false
        default: false
        type: boolean
      session_cookie:
        description: 'MDS Session Cookie (opsional, jika kosong otomatis ambil dari Storage / Auto-Login)'
        required: false
        default: ''
        type: string

  repository_dispatch:
    types: [trigger-sync-engine, trigger-scrab, trigger-mds-bisa, trigger-stock-only, trigger-photos, trigger-promo]

concurrency:
  group: retail-sync-group
  cancel-in-progress: false

jobs:
  sync:
    name: Run Python Retail Engine (3 Kategori)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 📥 Checkout Repository & Brankas Mapping 84.763 SKU
        uses: actions/checkout@v4

      - name: 🐍 Setup Python Turbo Environment (v3.11)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'python-engine/requirements.txt'

      - name: 📦 Install Python Engine Dependencies
        run: |
          pip install -r python-engine/requirements.txt

      - name: 🔥 [KATEGORI 1A - SCRAB BY LUQMAN ORG] Brutal Scraper by luqman org (Turbo Workers • SKU & Barcode Sweep)
        if: ${{ github.event.inputs.action == 'scrab' || github.event.inputs.action == 'mds-bisa' || github.event.inputs.action == 'all' || github.event.action == 'trigger-scrab' || github.event.action == 'trigger-mds-bisa' || github.event.action == 'trigger-sync-engine' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == '') }}
        run: |
          python python-engine/morning_full_sweep.py --brutal --upc-first --workers=24
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MDS_SESSION_COOKIE: ${{ github.event.inputs.session_cookie || secrets.MDS_SESSION_COOKIE }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://lzynugpistiyhxqkgwmk.supabase.co' }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY || secrets.SUPABASE_ANON_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || secrets.SUPABASE_KEY }}

      - name: 📦 [KATEGORI 1B - EKSPANSI & AUDIT ARTIKEL] Collect, Audit & Masak Artikel/Barcode (SUKO, Mu+Ku, ZES)
        if: ${{ github.event.inputs.action == 'scrab' || github.event.inputs.action == 'photos' || github.event.inputs.action == 'all' || github.event.action == 'trigger-scrab' || github.event.action == 'trigger-photos' || github.event.action == 'trigger-sync-engine' }}
        run: |
          if [ -n "$DATABASE_URL" ]; then
            python python-engine/matahari_catalog_expander.py
            python python-engine/raw_vault_collector.py --audit
          else
            echo "DATABASE_URL belum dikonfigurasi, lewati ekspansi artikel online."
          fi
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: 📸 [KATEGORI 1C - SCRAB GAMBAR] Brutal Image Scraper Matahari.com (4-Jalur Pure Product Photos)
        if: ${{ github.event.inputs.action == 'scrab' || github.event.inputs.action == 'photos' || github.event.inputs.action == 'all' || github.event.action == 'trigger-scrab' || github.event.action == 'trigger-photos' || github.event.action == 'trigger-sync-engine' }}
        run: |
          python python-engine/brutal_image_scraper.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://lzynugpistiyhxqkgwmk.supabase.co' }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY || secrets.SUPABASE_ANON_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || secrets.SUPABASE_KEY }}

      - name: ⚡ [KATEGORI 2 - UPDATE STOCK LIVE] Update Stok Terkini via Jalur Mapping 84.763 SKU & Artikel
        if: ${{ github.event.inputs.action == 'stock-only' || github.event.inputs.action == 'all' || github.event.action == 'trigger-stock-only' }}
        run: |
          python python-engine/morning_full_sweep.py --stock-only
        env:
          MDS_SESSION_COOKIE: ${{ github.event.inputs.session_cookie || secrets.MDS_SESSION_COOKIE }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://lzynugpistiyhxqkgwmk.supabase.co' }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY || secrets.SUPABASE_ANON_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || secrets.SUPABASE_KEY }}

      - name: 🏷️ [KATEGORI 3 - UPDATE PROMO EMAIL] Python Promo Email Parser Engine (Excel Storage + Gemini AI)
        if: ${{ github.event.inputs.action == 'promo' || github.event.inputs.action == 'all' || github.event.action == 'trigger-promo' || github.event.action == 'trigger-sync-engine' }}
        run: |
          PROMO_FLAG="${{ github.event.inputs.promo_url != '' && format('--file={0}', github.event.inputs.promo_url) || '' }}"
          python python-engine/run_promo_sync.py $PROMO_FLAG
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://lzynugpistiyhxqkgwmk.supabase.co' }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY || secrets.SUPABASE_ANON_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || secrets.SUPABASE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: 🧠 [KATEGORI 4 - CATALOG BRAIN INDEX] Susun Tabel CatalogArticle (Pre-Grouped & Anti-Dobel)
        if: ${{ success() }}
        run: |
          if [ -n "$DATABASE_URL" ]; then
            python python-engine/build_catalog_index.py
          else
            echo "DATABASE_URL belum dikonfigurasi di GitHub Secrets, lewati rebuild CatalogArticle."
          fi
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
