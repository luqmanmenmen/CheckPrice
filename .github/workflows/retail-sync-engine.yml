name: Retail Sync Engine (MDS BISA & Matahari Catalog)

on:
  schedule:
    # 02:30 UTC = 09:30 WIB (Pagi buka toko: Full Sync MDS BISA & Promo)
    - cron: '30 2 * * *'
    # 14:00 UTC = 21:00 WIB (Malam closing toko: Full Sync MDS BISA & Sisa Stok)
    - cron: '0 14 * * *'

  workflow_dispatch:
    inputs:
      action:
        description: 'Pilih aksi sinkronisasi yang dijalankan'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - mds-bisa
          - stock-only
          - photos
          - promo
      promo_url:
        description: 'URL file promo (opsional, jika kosong akan ambil file terbaru di Storage)'
        required: false
        default: ''
        type: string
      force:
        description: 'Paksa sinkronisasi walau di luar jam operasional toko (force bypass)'
        required: false
        default: false
        type: boolean

  repository_dispatch:
    types: [trigger-sync-engine, trigger-mds-bisa, trigger-stock-only, trigger-photos, trigger-promo]

concurrency:
  group: retail-sync-group
  cancel-in-progress: false

jobs:
  sync:
    name: Run Synchronization Engine
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js Environment (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 🐍 Setup Python Environment (v3.11)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'python-engine/requirements.txt'

      - name: 📦 Install Node Dependencies
        run: |
          npm install --no-audit --prefer-offline

      - name: 📦 Install Python Engine Dependencies
        run: |
          pip install -r python-engine/requirements.txt

      - name: ⚙️ Generate Prisma Client
        run: |
          npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      - name: 🏪 Run Trigger 1A — MDS BISA Full Sync (Produk Baru, Barcode, Style Code & Stok)
        if: ${{ github.event.inputs.action == 'all' || github.event.inputs.action == 'mds-bisa' || github.event_name == 'schedule' || github.event.action == 'trigger-mds-bisa' || github.event.action == 'trigger-sync-engine' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == '') }}
        run: |
          FORCE_FLAG="${{ github.event.inputs.force == 'true' && '--force' || '' }}"
          node scripts/sync_mds_bisa_full.mjs $FORCE_FLAG
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          MDS_SESSION_COOKIE: ${{ secrets.MDS_SESSION_COOKIE }}

      - name: ⚡ Run Trigger 1B — Fast Stock-Only Sync (Khusus Update Stok Toko)
        if: ${{ github.event.inputs.action == 'stock-only' || github.event.action == 'trigger-stock-only' }}
        run: |
          FORCE_FLAG="${{ github.event.inputs.force == 'true' && '--force' || '' }}"
          node scripts/sync_mds_bisa_full.mjs --stock-only $FORCE_FLAG
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          MDS_SESSION_COOKIE: ${{ secrets.MDS_SESSION_COOKIE }}

      - name: 🖼️ Run Trigger 2 — Matahari Photo Catalog Sync
        if: ${{ github.event.inputs.action == 'all' || github.event.inputs.action == 'photos' || github.event_name == 'schedule' || github.event.action == 'trigger-photos' || github.event.action == 'trigger-sync-engine' }}
        run: |
          node scripts/sync_matahari_images.js
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      - name: 🏷️ Run Trigger 3 — Python Promo Parser Engine (Pilar Promo Email)
        if: ${{ github.event.inputs.action == 'all' || github.event.inputs.action == 'promo' || github.event.action == 'trigger-promo' || github.event.action == 'trigger-sync-engine' }}
        run: |
          PROMO_FLAG="${{ github.event.inputs.promo_url != '' && format('--file={0}', github.event.inputs.promo_url) || '' }}"
          python python-engine/run_promo_sync.py $PROMO_FLAG
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://lzynugpistiyhxqkgwmk.supabase.co' }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
